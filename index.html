  <!-- Dynamic SEO Meta -->
  <script defer>
    document.addEventListener("DOMContentLoaded", async function () {
      try {
        const response = await fetch(
          "https://api.plusdistribution.in/meta/get-meta"
        );

        const data = await response.json();

        const siteMeta = data?.response?.metaInf?.find(
          (site) =>
            site.site_name === "mckenziefriendfamily.co.uk"
        );

        if (siteMeta) {
          // Title
          if (siteMeta.meta_title) {
            document.title = siteMeta.meta_title;
          }

          // Description
          const metaDescription = document.querySelector(
            'meta[name="description"]'
          );

          if (metaDescription && siteMeta.meta_desc) {
            metaDescription.setAttribute(
              "content",
              siteMeta.meta_desc
            );
          }

          // Keywords
          const metaKeywords = document.querySelector(
            'meta[name="keywords"]'
          );

          if (metaKeywords && siteMeta.meta_key) {
            metaKeywords.setAttribute(
              "content",
              siteMeta.meta_key
            );
          }

          // Open Graph Title
          const ogTitle = document.querySelector(
            'meta[property="og:title"]'
          );

          if (ogTitle && siteMeta.meta_title) {
            ogTitle.setAttribute(
              "content",
              siteMeta.meta_title
            );
          }

          // Open Graph Description
          const ogDescription = document.querySelector(
            'meta[property="og:description"]'
          );

          if (ogDescription && siteMeta.meta_desc) {
            ogDescription.setAttribute(
              "content",
              siteMeta.meta_desc
            );
          }

          // Twitter Title
          const twitterTitle = document.querySelector(
            'meta[name="twitter:title"]'
          );

          if (twitterTitle && siteMeta.meta_title) {
            twitterTitle.setAttribute(
              "content",
              siteMeta.meta_title
            );
          }

          // Twitter Description
          const twitterDescription = document.querySelector(
            'meta[name="twitter:description"]'
          );

          if (twitterDescription && siteMeta.meta_desc) {
            twitterDescription.setAttribute(
              "content",
              siteMeta.meta_desc
            );
          }

          // Image
          const imageUrl =
            siteMeta.meta_image ||
            "/favicon.ico";

          const ogImage = document.querySelector(
            'meta[property="og:image"]'
          );

          if (ogImage) {
            ogImage.setAttribute("content", imageUrl);
          }

          const twitterImage = document.querySelector(
            'meta[name="twitter:image"]'
          );

          if (twitterImage) {
            twitterImage.setAttribute("content", imageUrl);
          }
        }
      } catch (error) {
        console.error("Error fetching meta data:", error);
      }
    });
  </script>
